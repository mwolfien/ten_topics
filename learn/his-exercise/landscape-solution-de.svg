<svg viewBox="0 0 720 440" role="img" aria-labelledby="ex-t-de ex-d-de" xmlns="http://www.w3.org/2000/svg">
  <title id="ex-t-de">Musterlösung: Systemlandschaft des Falls</title>
  <desc id="ex-d-de">Eine KIS-Suite mit vier Modulen ist über den Kommunikationsserver mit LIS, Blutbank, RIS, OP-System und PDMS verbunden. Das PACS hängt nur direkt am RIS, die Monitoring-Geräte nur direkt am PDMS.</desc>
  <rect class="group" x="20" y="90" width="240" height="230" rx="14"/>
