<svg viewBox="0 0 720 260" role="img" aria-labelledby="cc-t-de cc-d-de" xmlns="http://www.w3.org/2000/svg">
  <title id="cc-t-de">Die CDSS-Kette am Beispiel von Maria K.</title>
  <desc id="cc-d-de">Daten, Trigger, Logik, Output, Aktion und Feedback bilden eine Kette; das Feedback fließt zurück in Daten, Regeln und Modelle.</desc>
  <defs><marker id="cc-a-de" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
  <rect class="node" x="13" y="70" width="102" height="84" rx="12"/>
  <text class="label" x="64.0" y="96" text-anchor="middle">DATA</text>
  <text class="small" x="64.0" y="120" text-anchor="middle">AF 26, RR 96,</text>
  <text class="small" x="64.0" y="136" text-anchor="middle">SpO₂ 91 %</text>
  <line class="edge" x1="116" y1="112" x2="128" y2="112" marker-end="url(#cc-a-de)"/>
  <rect class="node" x="129" y="70" width="102" height="84" rx="12"/>
  <text class="label" x="180.0" y="96" text-anchor="middle">TRIGGER</text>
  <text class="small" x="180.0" y="120" text-anchor="middle">neue</text>
  <text class="small" x="180.0" y="136" text-anchor="middle">Vitalwerte</text>
  <line class="edge" x1="232" y1="112" x2="244" y2="112" marker-end="url(#cc-a-de)"/>
  <rect class="node" x="245" y="70" width="102" height="84" rx="12"/>
  <text class="label" x="296.0" y="96" text-anchor="middle">LOGIC</text>
  <text class="small" x="296.0" y="120" text-anchor="middle">Regel oder</text>
  <text class="small" x="296.0" y="136" text-anchor="middle">Modell</text>
  <line class="edge" x1="348" y1="112" x2="360" y2="112" marker-end="url(#cc-a-de)"/>
  <rect class="node" x="361" y="70" width="102" height="84" rx="12"/>
  <text class="label" x="412.0" y="96" text-anchor="middle">OUTPUT</text>
  <text class="small" x="412.0" y="120" text-anchor="middle">Hinweis /</text>
  <text class="small" x="412.0" y="136" text-anchor="middle">Warnung</text>
  <line class="edge" x1="464" y1="112" x2="476" y2="112" marker-end="url(#cc-a-de)"/>
  <rect class="group" x="477" y="70" width="102" height="84" rx="12"/>
  <text class="label" x="528.0" y="96" text-anchor="middle">ACTION</text>
  <text class="small" x="528.0" y="120" text-anchor="middle">klinische</text>
  <text class="small" x="528.0" y="136" text-anchor="middle">Prüfung</text>
  <line class="edge" x1="580" y1="112" x2="592" y2="112" marker-end="url(#cc-a-de)"/>
  <rect class="node" x="593" y="70" width="102" height="84" rx="12"/>
  <text class="label" x="644.0" y="96" text-anchor="middle">FEEDBACK</text>
  <text class="small" x="644.0" y="120" text-anchor="middle">bestätigt oder</text>
  <text class="small" x="644.0" y="136" text-anchor="middle">verworfen</text>
  <text class="small" x="528.0" y="56" text-anchor="middle">hier entscheidet der Mensch</text>
  <line class="dashed" x1="528.0" y1="62" x2="528.0" y2="68"/>
  <path class="edge" d="M644.0 156 L644.0 200 L64.0 200 L64.0 160" fill="none" marker-end="url(#cc-a-de)"/>
  <text class="small" x="360" y="220" text-anchor="middle">Feedback verbessert Daten, Regeln und Modelle</text>
</svg>
