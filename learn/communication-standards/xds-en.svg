<svg viewBox="0 0 720 330" role="img" aria-labelledby="xd-t-en xd-d-en" xmlns="http://www.w3.org/2000/svg">
  <title id="xd-t-en">IHE XDS.b: sharing documents across organisations</title>
  <desc id="xd-d-en">The hospital as document source provides the discharge letter to a repository with ITI-41, which registers it in the registry with ITI-42. The GP practice as document consumer queries the registry with ITI-18 and retrieves the document from the repository with ITI-43.</desc>
  <defs><marker id="xd-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
  <rect class="node" x="20" y="30" width="180" height="58" rx="10"/>
  <text class="label" x="110.0" y="57.0" text-anchor="middle">Document source</text>
  <text class="small" x="110.0" y="74.0" text-anchor="middle">hospital</text>
  <rect class="node" x="270" y="30" width="180" height="58" rx="10"/>
  <text class="label" x="360.0" y="57.0" text-anchor="middle">Document repository</text>
  <text class="small" x="360.0" y="74.0" text-anchor="middle">stores documents</text>
  <rect class="node" x="520" y="30" width="180" height="58" rx="10"/>
  <text class="label" x="610.0" y="57.0" text-anchor="middle">Document registry</text>
  <text class="small" x="610.0" y="74.0" text-anchor="middle">knows the metadata</text>
  <rect class="group" x="395" y="240" width="180" height="58" rx="10"/>
  <text class="label" x="485.0" y="267.0" text-anchor="middle">Document consumer</text>
  <text class="small" x="485.0" y="284.0" text-anchor="middle">GP practice</text>
  <line class="edge" x1="200" y1="59" x2="266" y2="59" marker-end="url(#xd-en)"/>
  <line class="edge" x1="450" y1="59" x2="516" y2="59" marker-end="url(#xd-en)"/>
  <text class="small" x="235" y="118" text-anchor="middle">ITI-41 provide</text>
  <text class="small" x="485" y="118" text-anchor="middle">ITI-42 register</text>
  <line class="edge" x1="545" y1="238" x2="600" y2="92" marker-end="url(#xd-en)"/>
  <line class="edge" x1="425" y1="238" x2="370" y2="92" marker-end="url(#xd-en)"/>
  <text class="small" x="612" y="175">ITI-18 query</text>
  <text class="small" x="358" y="175" text-anchor="end">ITI-43 retrieve</text>
</svg>
