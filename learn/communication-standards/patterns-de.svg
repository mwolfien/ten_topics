<svg viewBox="0 0 720 250" role="img" aria-labelledby="cp-t-de cp-d-de" xmlns="http://www.w3.org/2000/svg">
  <title id="cp-t-de">Kommunikationsmuster</title>
  <desc id="cp-d-de">Push: der Sender schickt bei einem Ereignis. Pull: der Empfänger fragt bei Bedarf an und erhält eine Antwort. Publish/Subscribe: ein Sender publiziert an einen Vermittler, der an alle Abonnenten verteilt.</desc>
  <defs><marker id="cp-de" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
  <rect class="group" x="10" y="10" width="220" height="230" rx="14"/>
  <text class="label" x="120" y="38" text-anchor="middle">Push</text>
  <rect class="group" x="250" y="10" width="220" height="230" rx="14"/>
  <text class="label" x="360" y="38" text-anchor="middle">Pull</text>
  <rect class="group" x="490" y="10" width="220" height="230" rx="14"/>
  <text class="label" x="600" y="38" text-anchor="middle">Publish/Subscribe</text>
  <rect class="node" x="30" y="60" width="180" height="44" rx="10"/>
  <text class="label" x="120.0" y="86.0" text-anchor="middle">Sender</text>
  <rect class="node" x="30" y="176" width="180" height="44" rx="10"/>
  <text class="label" x="120.0" y="202.0" text-anchor="middle">Empfänger</text>
  <line class="edge" x1="120" y1="106" x2="120" y2="172" marker-end="url(#cp-de)"/>
  <text class="small" x="130" y="145">Ereignis</text>
  <rect class="node" x="270" y="60" width="180" height="44" rx="10"/>
  <text class="label" x="360.0" y="86.0" text-anchor="middle">Quelle</text>
  <rect class="node" x="270" y="176" width="180" height="44" rx="10"/>
  <text class="label" x="360.0" y="202.0" text-anchor="middle">Abfrager</text>
  <line class="edge" x1="330" y1="174" x2="330" y2="108" marker-end="url(#cp-de)"/>
  <line class="dashed" x1="390" y1="106" x2="390" y2="172" marker-end="url(#cp-de)"/>
  <text class="small" x="322" y="145" text-anchor="end">Anfrage</text>
  <text class="small" x="398" y="145">Antwort</text>
  <rect class="node" x="520" y="52" width="80" height="40" rx="10"/>
  <text class="label" x="560.0" y="76.0" text-anchor="middle">Pub</text>
  <rect class="hub" x="510" y="118" width="100" height="44" rx="10"/>
  <text class="hub-label" x="560.0" y="144.0" text-anchor="middle">Broker</text>
  <rect class="node" x="500" y="190" width="80" height="40" rx="10"/>
  <text class="label" x="540.0" y="214.0" text-anchor="middle">Sub A</text>
  <rect class="node" x="630" y="190" width="80" height="40" rx="10"/>
  <text class="label" x="670.0" y="214.0" text-anchor="middle">Sub B</text>
  <line class="edge" x1="560" y1="94" x2="560" y2="114" marker-end="url(#cp-de)"/>
  <line class="edge" x1="545" y1="164" x2="540" y2="186" marker-end="url(#cp-de)"/>
  <line class="edge" x1="590" y1="164" x2="660" y2="186" marker-end="url(#cp-de)"/>
</svg>
