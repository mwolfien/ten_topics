name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate data and README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown jupyterlite-core==0.8.7 jupyterlite-pyodide-kernel==0.8.7 jupyter-server
      - name: Validate data files
        run: python scripts/tentopics.py validate
      - name: Check that README.md is generated from the data files
        run: python scripts/tentopics.py build --check
      - name: Build the website (fails on broken internal links)
        run: python scripts/tentopics.py site --out "$RUNNER_TEMP/site"
      - name: Build the in-browser notebooks (JupyterLite)
        run: python scripts/build_lab.py --out "$RUNNER_TEMP/site"

  links:
    name: Check DOIs and links
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - run: python scripts/tentopics.py links
